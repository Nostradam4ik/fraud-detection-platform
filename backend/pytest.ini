[pytest]
# Coverage floor, not a goal: measured coverage is about 35%, so the previous 70% gate
# could never pass. Raise this number as tests are added; it must never go down.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=30
asyncio_mode = strict
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

[coverage:run]
source = app
omit =
    app/tests/*
    app/__init__.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
